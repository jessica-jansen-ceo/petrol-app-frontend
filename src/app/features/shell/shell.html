<div class="shell" [class.sidebar-open]="sidebarOpen()">
  <app-sidebar (navigate)="sidebarOpen.set(false)"></app-sidebar>

  <div class="backdrop" (click)="sidebarOpen.set(false)"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" (click)="sidebarOpen.set(!sidebarOpen())" aria-label="Menu">☰</button>
      <select class="station-switcher" [value]="settings.currentStation()" (change)="setStation($any($event.target).value)"
              title="Station">
        <option [value]="allStations">All Stations</option>
        @for (s of stations(); track s.id) { <option [value]="s.id">{{ s.name }}</option> }
      </select>
      <div class="spacer"></div>
      @if (user(); as u) {
        <div class="user-menu">
          <button class="user-trigger" [class.open]="menuOpen()" (click)="menuOpen.set(!menuOpen())"
                  aria-haspopup="menu" [attr.aria-expanded]="menuOpen()">
            <div class="meta">
              <strong>{{ u.displayName }}</strong>
              <small>{{ roleLabels[u.role] }}</small>
            </div>
            <div class="avatar">{{ u.displayName.charAt(0) }}</div>
            <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6"></path>
            </svg>
          </button>

          @if (menuOpen()) {
            <div class="menu-backdrop" (click)="menuOpen.set(false)"></div>
            <div class="menu" role="menu">
              <button role="menuitem" (click)="settings.toggleTheme()">
                @if (settings.theme() === 'dark') {
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path>
                  </svg>
                  <span>Light mode</span>
                } @else {
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
                  </svg>
                  <span>Dark mode</span>
                }
              </button>
              <button role="menuitem" class="logout-item" (click)="logout()">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <path d="M16 17l5-5-5-5M21 12H9"></path>
                </svg>
                <span>Logout</span>
              </button>
            </div>
          }
        </div>
      }
    </header>

    <main class="content"><router-outlet></router-outlet></main>
  </div>

  <app-overlays></app-overlays>
</div>
