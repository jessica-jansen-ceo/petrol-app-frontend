<div class="login-wrap">
  <form class="login-card" (submit)="$event.preventDefault()">
    <div class="brand">
      <div class="logo">{{ brand.appName.charAt(0) }}</div>
      <h1>{{ brand.appName }}</h1>
      <p>{{ brand.tagline }}</p>
    </div>

    <label>
      <span>Username</span>
      <input type="text" value="demo" disabled />
    </label>

    <label>
      <span>Password</span>
      <input type="password" value="demo" disabled />
    </label>

    <div class="quick">
      <span class="quick-label">Sign in as</span>
      <div class="quick-buttons">
        @for (r of roles; track r) {
          <button type="button" class="quick-btn" (click)="loginAs(r)">{{ roleLabels[r] }}</button>
        }
      </div>
    </div>

    <p class="poc-note">
      Proof of concept — credentials aren't validated. Choose a role above to sign in
      and preview that user's access.
    </p>
  </form>
</div>
